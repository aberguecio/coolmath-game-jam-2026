<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Farm Tycoon — Coolmath Jam 2026</title>
    <style>
      :root {
        --bg: #0f1923;
        --panel: #131e2b;
        --panel-2: #1a2633;
        --border: #243345;
        --fg: #e8edf3;
        --muted: #7a8694;
        --accent: #ffb347;
        --ok: #6ee7b7;
        --danger: #ff4d6d;
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        overflow: hidden;
      }
      #layout {
        display: flex;
        height: 100vh;
        gap: 16px;
        padding: 12px;
        box-sizing: border-box;
        transition: gap 180ms ease;
      }
      #layout.debug-hidden { gap: 0; }
      #app {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
      }
      #debug-toggle {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 10;
        background: var(--panel-2);
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 10px;
        font-family: inherit;
        font-size: 11px;
        cursor: pointer;
        user-select: none;
        transition: color 120ms ease, border-color 120ms ease;
      }
      #debug-toggle:hover { color: var(--accent); border-color: var(--accent); }
      #debug-toggle .hint { color: var(--muted); margin-left: 6px; opacity: 0.7; }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        box-shadow: 0 12px 60px rgba(0, 0, 0, 0.6);
      }
      #debug {
        width: 340px;
        flex-shrink: 0;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 11px;
        line-height: 1.45;
        overflow-y: auto;
        padding: 0;
        transition: width 180ms ease, opacity 180ms ease, margin 180ms ease;
      }
      #debug.hidden {
        width: 0;
        opacity: 0;
        border: none;
        pointer-events: none;
        overflow: hidden;
      }
      #debug header {
        position: sticky;
        top: 0;
        background: var(--panel-2);
        border-bottom: 1px solid var(--border);
        padding: 10px 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--accent);
        text-transform: uppercase;
        font-size: 11px;
        z-index: 1;
      }
      #debug section {
        border-bottom: 1px solid var(--border);
        padding: 10px 12px;
      }
      #debug section:last-child {
        border-bottom: none;
      }
      #debug h3 {
        margin: 0 0 6px 0;
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 600;
      }
      #debug .row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        white-space: nowrap;
      }
      #debug .row .k { color: var(--muted); }
      #debug .row .v { color: var(--fg); }
      #debug .keys {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        min-height: 22px;
      }
      #debug .key {
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 2px 8px;
        font-size: 10px;
        color: var(--fg);
      }
      #debug .key.held {
        background: var(--accent);
        color: #1a1a1a;
        border-color: var(--accent);
      }
      #debug .empty { color: var(--muted); font-style: italic; }
      #debug .list {
        max-height: 180px;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--bg);
      }
      #debug .item {
        padding: 4px 8px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      #debug .item:last-child { border-bottom: none; }
      #debug .item .name { color: var(--fg); overflow: hidden; text-overflow: ellipsis; }
      #debug .item .meta { color: var(--muted); font-size: 10px; flex-shrink: 0; }
      #debug .pill {
        display: inline-block;
        padding: 1px 6px;
        border-radius: 3px;
        background: var(--panel-2);
        color: var(--muted);
        font-size: 10px;
        margin-right: 4px;
      }
      #debug .pill.ok { background: rgba(110, 231, 183, 0.15); color: var(--ok); }
      #debug .pill.warn { background: rgba(255, 179, 71, 0.15); color: var(--accent); }
    </style>
  </head>
  <body>
    <div id="layout">
      <div id="app"></div>
      <aside id="debug">
        <header>Dev Inspector</header>
      </aside>
    </div>
    <button id="debug-toggle" type="button" hidden>Hide debug<span class="hint">`</span></button>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
